name: Sync Upstream Release

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: ${{ github.repository }}
      UPSTREAM_REPO: amtoaer/bili-sync
      TARGET_BRANCH: custom-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        shell: bash
        run: |
          git remote add upstream https://github.com/amtoaer/bili-sync.git || true
          git fetch upstream --tags --force

      - name: Prepare custom build tag from upstream release
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(gh api repos/$UPSTREAM_REPO/releases/latest --jq '.tag_name')"
          if [ -z "$latest_tag" ]; then
            echo "latest_tag not found"
            exit 1
          fi

          custom_tag="${latest_tag}-custom-build"

          if gh release view "$custom_tag" >/dev/null 2>&1; then
            echo "Custom release already exists: $custom_tag"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
            echo "custom_tag=$custom_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_sha="$(git ls-remote upstream "refs/tags/$latest_tag^{}" | awk '{print $1}')"
          if [ -z "$upstream_sha" ]; then
            upstream_sha="$(git ls-remote upstream "refs/tags/$latest_tag" | awk '{print $1}')"
          fi
          if [ -z "$upstream_sha" ]; then
            echo "Unable to resolve commit for upstream tag: $latest_tag"
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/$custom_tag" | grep -q "$custom_tag"; then
            echo "Custom tag already exists: $custom_tag"
          else
            git tag "$custom_tag" "$upstream_sha"
            git push origin "refs/tags/$custom_tag"
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "custom_tag=$custom_tag" >> "$GITHUB_OUTPUT"

      - name: Trigger custom release
        if: steps.sync.outputs.updated == 'true'
        env:
          CUSTOM_TAG: ${{ steps.sync.outputs.custom_tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run custom-release.yaml -R "$TARGET_REPO" --ref "$TARGET_BRANCH" -f custom_tag="$CUSTOM_TAG"
